<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Generator</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --card-font-size: 20px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Bar & Controls */
        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
            flex-wrap: nowrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .select-box {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
        }

        /* Profile Dropdown Component */
        .user-dropdown-container {
            position: relative;
            display: none; /* Login ဝင်မှ ပေါ်မည် */
        }
        .profile-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            cursor: pointer;
            object-fit: cover;
            transition: transform 0.2s;
        }
        .profile-btn:hover {
            transform: scale(1.05);
        }
        .dropdown-menu {
            position: absolute;
            top: 48px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            width: 240px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }
        .dropdown-menu.show {
            display: flex;
        }

        /* Avatar Upload Section inside Dropdown */
        .avatar-upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .avatar-preview-wrapper {
            position: relative;
            cursor: pointer;
        }
        .dropdown-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }
        .avatar-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            color: #fff;
            font-size: 12px;
        }
        .avatar-preview-wrapper:hover .avatar-overlay {
            opacity: 1;
        }
        .user-email-text {
            font-size: 12px;
            color: var(--text-muted);
            word-break: break-all;
            margin: 0;
            text-align: center;
        }

        /* Settings inside Dropdown */
        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .setting-label {
            display: flex;
            justify-content: space-between;
        }
        .slider-input {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* Menu Action Buttons */
        .menu-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background: #475569;
        }
        .logout-btn {
            background: #ef4444;
        }
        .logout-btn:hover {
            background: #dc2626;
        }

        /* Modern Auth Card */
        .auth-container {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 40px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 { margin: 0 0 10px 0; font-size: 24px; }
        .auth-header p { color: var(--text-muted); font-size: 14px; margin: 0; }

        .input-group {
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-google { background: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f1f5f9; }

        .auth-toggle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 15px;
            cursor: pointer;
        }

        /* Vertical Generator Layout */
        #main-app { display: none; width: 100%; max-width: 600px; flex-direction: column; align-items: center; }
        
        .vertical-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .order-card {
            background: var(--card-bg);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .order-card:hover {
            transform: translateY(-2px);
            background: #243347;
        }
        .card-label { color: var(--accent); font-size: 13px; font-weight: 500; }
        .card-number { 
            font-size: var(--card-font-size); 
            font-weight: 700; 
            letter-spacing: 1.5px; 
            color: #fff; 
            font-family: monospace; 
            transition: font-size 0.2s ease;
        }

        #toast {
            position: fixed;
            top: 20px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged,
            createUserWithEmailAndPassword, signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4pKIXlL9sk7xIP7-Yrqs5yGfit1lE_YM",
            authDomain: "order-generator-47380.firebaseapp.com",
            projectId: "order-generator-47380",
            storageBucket: "order-generator-47380.firebasestorage.app",
            messagingSenderId: "984303991759",
            appId: "1:984303991759:web:fa4c91d4a6cbb880b7f0ba",
            measurementId: "G-4Q041S41LD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const i18n = {
            zh: {
                titleSuffix: "位订单生成器",
                loginTitle: "登录账号",
                loginDesc: "请登录以使用订单号生成系统",
                emailPlaceholder: "邮箱地址",
                passPlaceholder: "密码",
                loginBtn: "登录",
                signUpBtn: "注册账号",
                googleBtn: "使用 Google 账号登录",
                toggleSignUp: "没有账号？点击注册",
                toggleLogin: "已有账号？点击登录",
                logout: "退出登录",
                switchAcc: "切换账号",
                fontSize: "字体大小",
                liveLabelPrefix: "● 实时生成",
                liveLabelSuffix: "位编号",
                clickCopy: "(点击卡片复制，每秒自动更新)",
                copied: "复制成功！",
                alertEmpty: "请输入邮箱和密码"
            },
            en: {
                titleSuffix: "-Digit Order Generator",
                loginTitle: "Sign In",
                loginDesc: "Please sign in to access the order generator",
                emailPlaceholder: "Email Address",
                passPlaceholder: "Password",
                loginBtn: "Sign In",
                signUpBtn: "Create Account",
                googleBtn: "Sign in with Google",
                toggleSignUp: "No account? Register here",
                toggleLogin: "Have an account? Sign in",
                logout: "Log Out",
                switchAcc: "Switch Account",
                fontSize: "Font Size",
                liveLabelPrefix: "● Live ",
                liveLabelSuffix: "-Digit Order ID",
                clickCopy: "(Click card to copy, updates every second)",
                copied: "Copied successfully!",
                alertEmpty: "Please fill in email and password"
            }
        };

        window.currentLang = "zh";
        window.selectedDigits = 14;
        let isSignUpMode = false;

        window.updateUI = function() {
            const t = i18n[window.currentLang];
            const digits = window.selectedDigits;

            document.getElementById('page-title').innerText = `${digits}${t.titleSuffix}`;
            document.getElementById('auth-title').innerText = isSignUpMode ? t.signUpBtn : t.loginTitle;
            document.getElementById('auth-desc').innerText = t.loginDesc;
            document.getElementById('email-input').placeholder = t.emailPlaceholder;
            document.getElementById('pass-input').placeholder = t.passPlaceholder;
            document.getElementById('submit-btn').innerText = isSignUpMode ? t.signUpBtn : t.loginBtn;
            document.getElementById('google-text').innerText = t.googleBtn;
            document.getElementById('toggle-auth').innerText = isSignUpMode ? t.toggleLogin : t.toggleSignUp;
            document.getElementById('logout-btn-text').innerText = t.logout;
            document.getElementById('switch-acc-text').innerText = t.switchAcc;
            document.getElementById('font-size-label').innerText = t.fontSize;
            document.getElementById('footer-tip').innerText = t.clickCopy;
            document.getElementById('toast').innerText = t.copied;
            
            document.querySelectorAll('.card-label').forEach(el => {
                el.innerText = `${t.liveLabelPrefix}${digits}${t.liveLabelSuffix}`;
            });

            if(window.updateAllNumbers) window.updateAllNumbers();
        };

        window.changeLanguage = function(lang) {
            window.currentLang = lang;
            window.updateUI();
        };

        window.changeDigits = function(digits) {
            window.selectedDigits = parseInt(digits);
            window.updateUI();
        };

        const authCard = document.getElementById('auth-card');
        const mainApp = document.getElementById('main-app');
        const profileContainer = document.getElementById('profile-container');
        const emailInput = document.getElementById('email-input');
        const passInput = document.getElementById('pass-input');
        const submitBtn = document.getElementById('submit-btn');
        const toggleAuth = document.getElementById('toggle-auth');

        toggleAuth.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            window.updateUI();
        });

        submitBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const pass = passInput.value;
            if(!email || !pass) return alert(i18n[window.currentLang].alertEmpty);

            if(isSignUpMode) {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => alert("Error: " + e.message));
            } else {
                signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Error: " + e.message));
            }
        });

        document.getElementById('google-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(e => alert("Google Login Error: " + e.message));
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
            document.getElementById('dropdown-menu').classList.remove('show');
        });

        // Switch Account (Sign out and show login)
        document.getElementById('switch-acc-btn').addEventListener('click', () => {
            signOut(auth);
            document.getElementById('dropdown-menu').classList.remove('show');
        });

        // Profile Dropdown Toggle
        document.getElementById('profile-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('dropdown-menu').classList.toggle('show');
        });

        document.getElementById('dropdown-menu').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents menu from closing when clicking inside
        });

        document.addEventListener('click', () => {
            document.getElementById('dropdown-menu').classList.remove('show');
        });

        // Image Upload Logic
        const avatarUpload = document.getElementById('avatar-upload');
        avatarUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const customImgData = evt.target.result;
                    document.getElementById('profile-btn').src = customImgData;
                    document.getElementById('dropdown-avatar-img').src = customImgData;
                    // Save custom avatar locally
                    localStorage.setItem('custom_avatar', customImgData);
                };
                reader.readAsDataURL(file);
            }
        });

        // Font Size Slider Logic
        const fontSlider = document.getElementById('font-size-slider');
        const fontSizeVal = document.getElementById('font-size-val');

        fontSlider.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            document.documentElement.style.setProperty('--card-font-size', size);
            fontSizeVal.innerText = size;
            localStorage.setItem('custom_font_size', e.target.value);
        });

        // Load Saved Font Size
        const savedFontSize = localStorage.getItem('custom_font_size');
        if(savedFontSize) {
            fontSlider.value = savedFontSize;
            document.documentElement.style.setProperty('--card-font-size', savedFontSize + 'px');
            fontSizeVal.innerText = savedFontSize + 'px';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authCard.style.display = 'none';
                mainApp.style.display = 'flex';
                profileContainer.style.display = 'block';
                document.getElementById('user-email').innerText = user.email;

                // Priority: Local Custom Avatar > User Photo > Placeholder
                const savedAvatar = localStorage.getItem('custom_avatar');
                const defaultPhoto = user.photoURL || 'https://via.placeholder.com/50/4f46e5/fff?text=U';
                const finalPhoto = savedAvatar || defaultPhoto;

                document.getElementById('profile-btn').src = finalPhoto;
                document.getElementById('dropdown-avatar-img').src = finalPhoto;
            } else {
                authCard.style.display = 'block';
                mainApp.style.display = 'none';
                profileContainer.style.display = 'none';
            }
        });
    </script>
</head>
<body>

    <div class="top-nav">
        <h3 id="page-title" style="margin:0;">14位订单生成器</h3>
        
        <div class="control-group">
            <!-- Digits Selector -->
            <select class="select-box" onchange="changeDigits(this.value)">
                <option value="20">20 Digits / 位</option>
                <option value="19">19 Digits / 位</option>
                <option value="18">18 Digits / 位</option>
                <option value="17">17 Digits / 位</option>
                <option value="16">16 Digits / 位</option>
                <option value="15">15 Digits / 位</option>
                <option value="14" selected>14 Digits / 位</option>
                <option value="13">13 Digits / 位</option>
            </select>

            <!-- Language Switcher -->
            <select class="select-box" onchange="changeLanguage(this.value)">
                <option value="zh">中文</option>
                <option value="en">English</option>
            </select>

            <!-- Profile Avatar with Enhanced Dropdown -->
            <div class="user-dropdown-container" id="profile-container">
                <img id="profile-btn" class="profile-btn" src="" alt="User Profile">
                
                <div class="dropdown-menu" id="dropdown-menu">
                    <!-- Avatar Upload & Info -->
                    <div class="avatar-upload-section">
                        <label for="avatar-upload" class="avatar-preview-wrapper" title="Click to change photo">
                            <img id="dropdown-avatar-img" class="dropdown-avatar" src="" alt="Avatar">
                            <div class="avatar-overlay"><i class="fa-solid fa-camera"></i></div>
                        </label>
                        <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
                        <p class="user-email-text" id="user-email"></p>
                    </div>

                    <!-- Font Size Setting -->
                    <div class="setting-item">
                        <div class="setting-label">
                            <span id="font-size-label">字体大小</span>
                            <span id="font-size-val">20px</span>
                        </div>
                        <input type="range" id="font-size-slider" class="slider-input" min="14" max="28" value="20">
                    </div>

                    <!-- Actions -->
                    <button class="menu-btn" id="switch-acc-btn">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span id="switch-acc-text">切换账号</span>
                    </button>

                    <button class="menu-btn logout-btn" id="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span id="logout-btn-text">退出登录</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Form Card -->
    <div class="auth-container" id="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">登录账号</h2>
            <p id="auth-desc">请登录以使用订单号生成系统</p>
        </div>

        <div class="input-group">
            <input type="email" id="email-input" placeholder="邮箱地址">
        </div>
        <div class="input-group">
            <input type="password" id="pass-input" placeholder="密码">
        </div>

        <button class="btn btn-primary" id="submit-btn">登录</button>
        <button class="btn btn-google" id="google-btn">
            <i class="fa-brands fa-google" style="color: #4285F4;"></i>
            <span id="google-text">使用 Google 账号登录</span>
        </button>

        <div class="auth-toggle" id="toggle-auth">没有账号？点击注册</div>
    </div>

    <!-- Main Generator Dashboard -->
    <div id="main-app">
        <div id="toast">复制成功！</div>
        <div class="vertical-container" id="container"></div>
        <p id="footer-tip" style="color: var(--text-muted); font-size: 14px; margin-top: 20px;">(点击卡片复制，每秒自动更新)</p>
    </div>

    <script>
        const container = document.getElementById('container');
        const toast = document.getElementById('toast');

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 1200);
            });
        }

        function generateOrderNumber(targetLength) {
            const now = new Date();
            const yy = now.getFullYear().toString().slice(-2);
            const mm = (now.getMonth() + 1).toString().padStart(2, '0');
            const dd = now.getDate().toString().padStart(2, '0');
            const hh = now.getHours().toString().padStart(2, '0');
            const min = now.getMinutes().toString().padStart(2, '0');
            const ss = now.getSeconds().toString().padStart(2, '0');
            
            let baseString = yy + mm + dd + hh + min + ss;

            if (targetLength <= 12) {
                return baseString.slice(0, targetLength);
            }

            const neededRandomDigits = targetLength - baseString.length;
            let randomPart = '';
            for (let i = 0; i < neededRandomDigits; i++) {
                randomPart += Math.floor(Math.random() * 10).toString();
            }

            return baseString + randomPart;
        }

        const totalCards = 14;
        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <span class="card-label">● 实时生成14位编号</span>
                <div class="card-number" id="num-${i}">Loading...</div>
            `;
            card.onclick = function() {
                const numText = document.getElementById(`num-${i}`).innerText;
                copyToClipboard(numText);
            };
            container.appendChild(card);
        }

        window.updateAllNumbers = function() {
            const length = window.selectedDigits || 14;
            for (let i = 0; i < totalCards; i++) {
                const el = document.getElementById(`num-${i}`);
                if(el) el.innerText = generateOrderNumber(length);
            }
        };

        setInterval(window.updateAllNumbers, 1000);
        window.updateAllNumbers();
    </script>
</body>
</html>
