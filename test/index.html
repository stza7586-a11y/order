<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Generator</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Bar & Controls */
        .top-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            gap: 10px;
        }
        .select-box {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
        }

        /* Modern Auth Card */
        .auth-container {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 40px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 { margin: 0 0 10px 0; font-size: 24px; }
        .auth-header p { color: var(--text-muted); font-size: 14px; margin: 0; }

        .input-group {
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-google { background: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background: #f1f5f9; }

        .auth-toggle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 15px;
            cursor: pointer;
        }

        /* User Header Area */
        #user-bar {
            display: none;
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 12px 20px;
            border-radius: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        /* Vertical Generator Layout */
        #main-app { display: none; width: 100%; max-width: 600px; flex-direction: column; align-items: center; }
        
        /* Column/Vertical Layout (ဒေါလိုက်တန်းစီခြင်း) */
        .vertical-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .order-card {
            background: var(--card-bg);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .order-card:hover {
            transform: translateY(-2px);
            background: #243347;
        }
        .card-label { color: var(--accent); font-size: 13px; font-weight: 500; }
        .card-number { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; color: #fff; font-family: monospace; }

        #toast {
            position: fixed;
            top: 20px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged,
            createUserWithEmailAndPassword, signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4pKIXlL9sk7xIP7-Yrqs5yGfit1lE_YM",
            authDomain: "order-generator-47380.firebaseapp.com",
            projectId: "order-generator-47380",
            storageBucket: "order-generator-47380.firebasestorage.app",
            messagingSenderId: "984303991759",
            appId: "1:984303991759:web:fa4c91d4a6cbb880b7f0ba",
            measurementId: "G-4Q041S41LD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Translation Dictionary
        const i18n = {
            zh: {
                titleSuffix: "位订单生成器",
                loginTitle: "登录账号",
                loginDesc: "请登录以使用订单号生成系统",
                emailPlaceholder: "邮箱地址",
                passPlaceholder: "密码",
                loginBtn: "登录",
                signUpBtn: "注册账号",
                googleBtn: "使用 Google 账号登录",
                toggleSignUp: "没有账号？点击注册",
                toggleLogin: "已有账号？点击登录",
                logout: "退出登录",
                liveLabelPrefix: "● 实时生成",
                liveLabelSuffix: "位编号",
                clickCopy: "(点击卡片复制，每秒自动更新)",
                copied: "复制成功！",
                alertEmpty: "请输入邮箱和密码"
            },
            en: {
                titleSuffix: "-Digit Order Generator",
                loginTitle: "Sign In",
                loginDesc: "Please sign in to access the order generator",
                emailPlaceholder: "Email Address",
                passPlaceholder: "Password",
                loginBtn: "Sign In",
                signUpBtn: "Create Account",
                googleBtn: "Sign in with Google",
                toggleSignUp: "No account? Register here",
                toggleLogin: "Have an account? Sign in",
                logout: "Log Out",
                liveLabelPrefix: "● Live ",
                liveLabelSuffix: "-Digit Order ID",
                clickCopy: "(Click card to copy, updates every second)",
                copied: "Copied successfully!",
                alertEmpty: "Please fill in email and password"
            }
        };

        window.currentLang = "zh";
        window.selectedDigits = 14;
        let isSignUpMode = false;

        window.updateUI = function() {
            const t = i18n[window.currentLang];
            const digits = window.selectedDigits;

            // Page Title Update
            document.getElementById('page-title').innerText = `${digits}${t.titleSuffix}`;
            
            // Auth Form Text Updates
            document.getElementById('auth-title').innerText = isSignUpMode ? t.signUpBtn : t.loginTitle;
            document.getElementById('auth-desc').innerText = t.loginDesc;
            document.getElementById('email-input').placeholder = t.emailPlaceholder;
            document.getElementById('pass-input').placeholder = t.passPlaceholder;
            document.getElementById('submit-btn').innerText = isSignUpMode ? t.signUpBtn : t.loginBtn;
            document.getElementById('google-text').innerText = t.googleBtn;
            document.getElementById('toggle-auth').innerText = isSignUpMode ? t.toggleLogin : t.toggleSignUp;
            document.getElementById('logout-btn').innerText = t.logout;
            document.getElementById('footer-tip').innerText = t.clickCopy;
            document.getElementById('toast').innerText = t.copied;
            
            // Card Labels Update
            document.querySelectorAll('.card-label').forEach(el => {
                el.innerText = `${t.liveLabelPrefix}${digits}${t.liveLabelSuffix}`;
            });

            // Refresh generated numbers immediately
            if(window.updateAllNumbers) window.updateAllNumbers();
        };

        window.changeLanguage = function(lang) {
            window.currentLang = lang;
            window.updateUI();
        };

        window.changeDigits = function(digits) {
            window.selectedDigits = parseInt(digits);
            window.updateUI();
        };

        // DOM Elements
        const authCard = document.getElementById('auth-card');
        const mainApp = document.getElementById('main-app');
        const userBar = document.getElementById('user-bar');
        const emailInput = document.getElementById('email-input');
        const passInput = document.getElementById('pass-input');
        const submitBtn = document.getElementById('submit-btn');
        const toggleAuth = document.getElementById('toggle-auth');

        toggleAuth.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            window.updateUI();
        });

        // Form Submit Login/Register
        submitBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const pass = passInput.value;
            if(!email || !pass) return alert(i18n[window.currentLang].alertEmpty);

            if(isSignUpMode) {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => alert("Error: " + e.message));
            } else {
                signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Error: " + e.message));
            }
        });

        // Google Login
        document.getElementById('google-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(e => alert("Google Login Error: " + e.message));
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Auth Monitor State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authCard.style.display = 'none';
                mainApp.style.display = 'flex';
                userBar.style.display = 'flex';
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/36/4f46e5/fff?text=U';
            } else {
                authCard.style.display = 'block';
                mainApp.style.display = 'none';
                userBar.style.display = 'none';
            }
        });
    </script>
</head>
<body>

    <div class="top-nav">
        <h3 id="page-title" style="margin:0;">14位订单生成器</h3>
        
        <div class="control-group">
            <!-- Digits Selector (20 down to 13) -->
            <select class="select-box" onchange="changeDigits(this.value)">
                <option value="20">20 Digits / 位</option>
                <option value="19">19 Digits / 位</option>
                <option value="18">18 Digits / 位</option>
                <option value="17">17 Digits / 位</option>
                <option value="16">16 Digits / 位</option>
                <option value="15">15 Digits / 位</option>
                <option value="14" selected>14 Digits / 位</option>
                <option value="13">13 Digits / 位</option>
            </select>

            <!-- Language Switcher (Chinese & English only) -->
            <select class="select-box" onchange="changeLanguage(this.value)">
                <option value="zh">中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <!-- Auth Form Card -->
    <div class="auth-container" id="auth-card">
        <div class="auth-header">
            <h2 id="auth-title">登录账号</h2>
            <p id="auth-desc">请登录以使用订单号生成系统</p>
        </div>

        <div class="input-group">
            <input type="email" id="email-input" placeholder="邮箱地址">
        </div>
        <div class="input-group">
            <input type="password" id="pass-input" placeholder="密码">
        </div>

        <button class="btn btn-primary" id="submit-btn">登录</button>
        <button class="btn btn-google" id="google-btn">
            <i class="fa-brands fa-google" style="color: #4285F4;"></i>
            <span id="google-text">使用 Google 账号登录</span>
        </button>

        <div class="auth-toggle" id="toggle-auth">没有账号？点击注册</div>
    </div>

    <!-- User Header Bar -->
    <div id="user-bar">
        <div class="user-profile">
            <img id="user-avatar" class="avatar" src="" alt="User">
            <span id="user-email" style="font-weight: 600;"></span>
        </div>
        <button class="logout-btn" id="logout-btn">退出登录</button>
    </div>

    <!-- Main Generator Dashboard -->
    <div id="main-app">
        <div id="toast">复制成功！</div>
        <!-- Vertical Column Container -->
        <div class="vertical-container" id="container"></div>
        <p id="footer-tip" style="color: var(--text-muted); font-size: 14px; margin-top: 20px;">(点击卡片复制，每秒自动更新)</p>
    </div>

    <script>
        const container = document.getElementById('container');
        const toast = document.getElementById('toast');

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 1200);
            });
        }

        // Dynamic Order ID Generator Algorithm for custom length
        function generateOrderNumber(targetLength) {
            const now = new Date();
            const yy = now.getFullYear().toString().slice(-2);
            const mm = (now.getMonth() + 1).toString().padStart(2, '0');
            const dd = now.getDate().toString().padStart(2, '0');
            const hh = now.getHours().toString().padStart(2, '0');
            const min = now.getMinutes().toString().padStart(2, '0');
            const ss = now.getSeconds().toString().padStart(2, '0');
            
            // Base timestamp-based string length is 12 (YYMMDDHHMMSS)
            let baseString = yy + mm + dd + hh + min + ss;

            if (targetLength <= 12) {
                return baseString.slice(0, targetLength);
            }

            const neededRandomDigits = targetLength - baseString.length;
            let randomPart = '';
            for (let i = 0; i < neededRandomDigits; i++) {
                randomPart += Math.floor(Math.random() * 10).toString();
            }

            return baseString + randomPart;
        }

        // Render Cards Vertically
        const totalCards = 14;
        for (let i = 0; i < totalCards; i++) {
            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <span class="card-label">● 实时生成14位编号</span>
                <div class="card-number" id="num-${i}">Loading...</div>
            `;
            card.onclick = function() {
                const numText = document.getElementById(`num-${i}`).innerText;
                copyToClipboard(numText);
            };
            container.appendChild(card);
        }

        window.updateAllNumbers = function() {
            const length = window.selectedDigits || 14;
            for (let i = 0; i < totalCards; i++) {
                const el = document.getElementById(`num-${i}`);
                if(el) el.innerText = generateOrderNumber(length);
            }
        };

        setInterval(window.updateAllNumbers, 1000);
        window.updateAllNumbers();
    </script>
</body>
</html>
